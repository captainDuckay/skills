name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every root folder with a SKILL.md must have front matter whose `name` matches the
      # folder and a non-empty `description` (what the skills manager and the School site read).
      - name: Check SKILL.md front matter
        run: |
          status=0
          found=0
          for f in */SKILL.md; do
            found=1
            dir=${f%/SKILL.md}
            fm=$(awk 'NR==1 && $0!="---"{exit} NR>1 && $0=="---"{exit} NR>1{print}' "$f")
            name=$(printf '%s\n' "$fm" | sed -n 's/^name:[[:space:]]*//p' | tr -d '"'"'"'')
            desc=$(printf '%s\n' "$fm" | sed -n 's/^description:[[:space:]]*//p')
            if [ "$name" != "$dir" ]; then echo "::error file=$f::name '$name' does not match folder '$dir'"; status=1; fi
            if [ -z "$desc" ]; then echo "::error file=$f::missing description"; status=1; fi
          done
          [ $found = 1 ] || { echo "::error::no skills found"; status=1; }
          exit $status
